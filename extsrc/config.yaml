schema: 1

name: my-develop

version: "2.1.1"

hints:
  global:
    - "Language preferences (chat, specs, comments, logs): if not set in context, ask the user and record them in an appropriate rule under spawn/rules."
    - "No emojis or exotic Unicode in code, logs, documentation, or messages; plain ASCII where practical. Allowed only: ⚠️, 🔴🟠🟢🔵🟣🟡, ✅❌; everything else is forbidden."
    - "User-facing replies, specs, documentation, and comments: concise wording; do not omit important points; minimal markdown (avoid decorative bold/italic); short, clear sentences; prefer lists and structured layout over long paragraphs; for selected terms, give a short definition inline right where the term first appears."
    - "Do not create or update docs (README, USAGE, etc.) unless requested or required by the process."
    - "Do not write comments, log messages, or in-code text unless requested or required by the process."
    - "If the user only asked a question, answer first; do not edit files unless changes are clearly needed."
    - "For external info use available tools: Context7 (resolve-library-id -> query-docs) for library/API docs, search / fetchWebContent / fetchGithubReadme for web info."
    - "Prefer Python scripts for tooling and automation."
    - "After code edits and task completion: build the project, run syntax checks if applicable, run tests when present; then summarize briefly what changed and where."

folders:
  spec/extend:
    description: "C# / .NET and React/Vite frontend stack conventions — layout, abstractions, DI, WebApi, workers, EF Core, SPA."
    mode: static

files:
  spec/extend/01-csharp-style.md:
    description: "Fluent style, DI, immutability, naming, CPM/vuln audit, errors, async/cancellation."
    mode: static
    globalRead: required
    localRead: no

  spec/extend/02-csharp-solution-layout.md:
    description: "Solution layout, project roles, tool modules, optional registrars."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/03-entity-framework-core.md:
    description: "EF Core layout, DbContext, factory registration, migrations, domain stores."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/04-http-client.md:
    description: "IHttpClientFactory, HttpClient usage, structured error branching."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/06-abstractions-layer.md:
    description: "Abstractions layout, contracts, naming."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/07-di-registration.md:
    description: "DI extensions, options, keyed services (DefaultKey, WithOptions), lifetimes."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/08-webapi-minimal.md:
    description: "Minimal APIs, auth, SignalR, route groups, DTOs."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/09-processors-workers-jobs.md:
    description: "Processor, Worker, Jobs patterns; cancel and checkpoints."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/10-implementation-projects.md:
    description: "Impl project naming, layout, registration."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/11-frontend-solution-layout.md:
    description: "Frontend SPA layout — app/features/shared, naming, dependencies."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/12-frontend-data-state-routing.md:
    description: "React Query, Zustand, HTTP, auth, routing, SignalR."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/13-frontend-ui-forms-i18n.md:
    description: "shadcn/ui, Tailwind, forms, resizable layout, i18n."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/14-frontend-tooling.md:
    description: "Vite, Vitest, ESLint, env, Docker/nginx SPA deploy."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/15-domain-errors-localization.md:
    description: "Domain exception with UserMessageCode, parameters, 422 mapping."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/16-frontend-domain-errors.md:
    description: "Frontend 422 parsing, ApiDomainError, i18n localized messages."
    mode: static
    globalRead: auto
    localRead: no

  spec/extend/17-ui-design.md:
    description: "Distinctive, intentional UI design: aesthetic direction, typography, accessibility, design tokens, avoiding templated AI defaults."
    mode: static
    globalRead: auto
    localRead: no

skills:
  commit-push.md:
    name: commit-push
    description: "Commit and push changes in a git session repo - stage all, concise conventional message, push to origin."

  feature-fullstack.md:
    name: feature-fullstack
    description: "Scaffold a full-stack feature (backend + frontend)."
    required-read:
      - spec/extend/02-csharp-solution-layout.md
      - spec/extend/06-abstractions-layer.md
      - spec/extend/07-di-registration.md
      - spec/extend/08-webapi-minimal.md
      - spec/extend/10-implementation-projects.md
      - spec/extend/11-frontend-solution-layout.md
      - spec/extend/12-frontend-data-state-routing.md
      - spec/extend/13-frontend-ui-forms-i18n.md
      - spec/extend/16-frontend-domain-errors.md

  feature-backend.md:
    name: feature-backend
    description: "Scaffold a backend feature - abstractions, implementation, DI, endpoints."
    required-read:
      - spec/extend/02-csharp-solution-layout.md
      - spec/extend/03-entity-framework-core.md
      - spec/extend/06-abstractions-layer.md
      - spec/extend/07-di-registration.md
      - spec/extend/08-webapi-minimal.md
      - spec/extend/09-processors-workers-jobs.md
      - spec/extend/10-implementation-projects.md

  feature-frontend.md:
    name: feature-frontend
    description: "Scaffold a frontend feature slice - page, API, store, i18n."
    required-read:
      - spec/extend/11-frontend-solution-layout.md
      - spec/extend/12-frontend-data-state-routing.md
      - spec/extend/13-frontend-ui-forms-i18n.md
      - spec/extend/16-frontend-domain-errors.md

setup: {}

agent-ignore: []

