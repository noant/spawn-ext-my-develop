    required-read:
      - spec/extend/09-processors-workers-jobs.md
      - spec/extend/07-di-registration.md

  new-implementation-project.md:
    name: new-implementation-project
    description: "Scaffold technology-specific implementation."
    required-read:
      - spec/extend/10-implementation-projects.md
      - spec/extend/06-abstractions-layer.md
      - spec/extend/07-di-registration.md

  new-frontend-feature.md:
    name: new-frontend-feature
